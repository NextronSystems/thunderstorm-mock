openapi: 3.0.4
info:
  description: This API allows you to send files to THOR to scan them and provides
    information about the running THOR instance.
  title: THOR Thunderstorm API
  version: 1.0.0
servers:
- description: Local THOR instance
  url: http://localhost:8080/api/v1
tags:
- description: Endpoints to scan files with THOR
  name: scan
- description: Endpoints to retrieve results of asynchronous scans
  name: results
- description: Endpoints to retrieve information about the running THOR instance
  name: info
paths:
  /check:
    post:
      description: Check a file with THOR
      operationId: check
      parameters:
      - description: Specify source for the THOR log
        explode: true
        in: query
        name: source
        required: false
        schema:
          type: string
        style: form
      requestBody:
        $ref: "#/components/requestBodies/FileUpload"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThorReport"
          description: Returns a list of findings
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Invalid parameters given
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
      summary: Check a file with THOR
      tags:
      - scan
  /checkAsync:
    post:
      description: Check a file with THOR asynchronously
      operationId: checkAsync
      parameters:
      - description: Specify source for the THOR log
        explode: true
        in: query
        name: source
        required: false
        schema:
          type: string
        style: form
      requestBody:
        $ref: "#/components/requestBodies/FileUpload"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SampleIdObj"
          description: Returns a map containing the sample ID
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Invalid parameters given
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
      summary: Check a file with THOR asynchronously
      tags:
      - scan
  /getAsyncResults:
    get:
      description: Retrieve the results of an asynchronous file check.
      operationId: getAsyncResults
      parameters:
      - description: Sample ID
        explode: true
        in: query
        name: id
        required: true
        schema:
          $ref: "#/components/schemas/SampleId"
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncResult"
          description: "Returns a JSON with the current status and, if applicable,\
            \ the results"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Invalid parameters given
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
      summary: Retrieve the results of an asynchronous file check
      tags:
      - results
  /queueHistory:
    get:
      description: Retrieve a history of how many asynchronous requests were queued
      operationId: queueHistory
      parameters:
      - description: Aggregate this many minutes per value (default 1).
        explode: true
        in: query
        name: aggregate
        required: false
        schema:
          format: int64
          type: integer
        style: form
      - description: Give a history for the last this many minutes (default infinite).
        explode: true
        in: query
        name: limit
        required: false
        schema:
          format: int64
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimestampMap"
          description: A JSON Map with each time mapped to the queue length (estimated)
            from the last time mentioned to that time.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Invalid parameters given
      summary: Retrieve a history of how many asynchronous requests were queued
      tags:
      - info
  /sampleHistory:
    get:
      description: Retrieve a history of how many samples were scanned.
      operationId: sampleHistory
      parameters:
      - description: Aggregate this many minutes per value (default 1).
        explode: true
        in: query
        name: aggregate
        required: false
        schema:
          format: int64
          type: integer
        style: form
      - description: Give a history for the last this many minutes (default infinite).
        explode: true
        in: query
        name: limit
        required: false
        schema:
          format: int64
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimestampMap"
          description: Returns a JSON Map with each time mapped to the samples scanned
            from the last time mentioned to that time
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Invalid parameters given
      summary: Retrieve a history of how many samples were scanned
      tags:
      - info
  /info:
    get:
      description: Receive static information about the running THOR instance.
      operationId: info
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThunderstormInfo"
          description: "Map with values to running version, rate limitation, ..."
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
      summary: Receive static information about the running THOR instance
      tags:
      - info
  /status:
    get:
      description: Receive live information about the running THOR instance.
      operationId: status
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThunderstormStatus"
          description: "Map with values to scan times, scanned samples, wait times,\
            \ ..."
      summary: Receive live information about the running THOR instance
      tags:
      - info
components:
  parameters:
    SampleSource:
      description: Specify source for the THOR log
      explode: true
      in: query
      name: source
      required: false
      schema:
        type: string
      style: form
    AggregationPeriod:
      description: Aggregate this many minutes per value (default 1).
      explode: true
      in: query
      name: aggregate
      required: false
      schema:
        format: int64
        type: integer
      style: form
    HistoryLimit:
      description: Give a history for the last this many minutes (default infinite).
      explode: true
      in: query
      name: limit
      required: false
      schema:
        format: int64
        type: integer
      style: form
  requestBodies:
    FileUpload:
      content:
        multipart/form-data:
          schema:
            $ref: "#/components/schemas/FileObject"
      description: Multipart form data containing a file
      required: true
  responses:
    QueueHistory:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TimestampMap"
      description: A JSON Map with each time mapped to the queue length (estimated)
        from the last time mentioned to that time.
    SampleHistory:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TimestampMap"
      description: Returns a JSON Map with each time mapped to the samples scanned
        from the last time mentioned to that time
    BadRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Invalid parameters given
    InternalServerError:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
      description: Unauthorized
  schemas:
    FileObject:
      description: Wrapped file
      properties:
        file:
          description: File to be checked
          format: binary
          type: string
      required:
      - file
      type: object
    ThorReport:
      description: THOR Report containing findings
      example:
      - type: THOR finding
        meta:
          time: 2026-01-16T13:35:34.11133172+01:00
          level: Alert
          module: HTTPServer
          scan_id: S-qkQv5yHIUHk-2
          hostname: 127.0.0.1
        message: Malicious file found
        subject:
          type: file
          path: somefile.exe
          exists: "yes"
          extension: .exe
          magic_header: EXE
          hashes:
            md5: 7168892693d7716220d98883fffd848c
            sha1: 42acd9b554e1c843a9f8139022b560de0bf48682
            sha256: 660464c473c47784d8820d3e268c0d1327ac22ce0e607dc35e858628c53f0687
          first_bytes:
            hex: 4d5a90000300000004000000ffff0000b8000000
            ascii: MZ
          size: 1352192
          permissions: null
          content:
            type: sparse data
            elements:
            - offset: 856110
              data: '>`ncrypt.dll'
            length: 1352192
        score: 94
        reasons:
        - type: reason
          summary: some YARA rule
          signature:
            score: 85
            reference:
            - Internal Research
            origin: internal
            kind: YARA Rule
            date: 2023-05-12
            tags:
            - EXE
            - HKTL
            rule_name: Some_Rule_Name
            description: Detects Something
          matched:
          - data: '%*s**CREDENTIAL**'
            offset: 918480
            field: /content
          - data: "%*s  Persist        : %08x - %u - %s"
            offset: 919056
            field: /content
          - data: '%*s**DOMAINKEY**'
            offset: 950688
            field: /content
        - type: reason
          summary: Another rule
          signature:
            score: 80
            reference:
            - Some reference
            origin: internal
            kind: YARA Rule
            date: 2016-02-05
            tags:
            - T1059_001
            rule_name: Another_Rule_Name
            description: Detects Something other
          matched:
          - data: kuhl_m_lsadump_getUsersAndSamKey ; kull_m_registry_RegOpenKeyEx
              SAM Accounts (0x%08x)
            offset: 1100540
            field: /content
          - data: kuhl_m_lsadump_getComputerAndSyskey ; kuhl_m_lsadump_getSyskey KO
            offset: 1099708
            field: /content
        reason_count: 28
        context: null
        log_version: v3.0.0
      items:
        $ref: "#/components/schemas/ThorFinding"
      type: array
    ThorFinding:
      additionalProperties: true
      description: THOR Finding
      type: object
    SampleIdObj:
      description: Object containing the Sample ID returned for an asynchronous scan
        request
      example:
        id: 12345
      properties:
        id:
          description: Sample ID returned for an asynchronous scan request
          example: 12345
          format: int64
          type: integer
      required:
      - id
      type: object
    SampleId:
      description: Sample ID returned for an asynchronous scan request
      example: 12345
      format: int64
      type: integer
    AsyncResult:
      description: Result object for asynchronous scan operations
      example:
        result:
        - type: THOR finding
          meta:
            time: 2026-01-19T16:08:27.809483955+01:00
            level: Warning
            module: HTTPServer
            scan_id: S-qiVIo7fm2Yk-4
            hostname: 127.0.0.1
          message: Suspicious file found
          subject:
            type: file
            path: 6700758b14fe8ac1bbcbbf3d652613d8
            exists: "yes"
            extension: ""
            magic_header: UNKNOWN
            hashes:
              md5: ffc74d5afc22d1f1c785f98154cc7bae
              sha1: 9603a4806528578686dc5f02b805c64414b3c91b
              sha256: da1d2378fbacf84d09d18a94def83cd3bfc06e89e7429ba3de57cd96a0e04a87
            first_bytes:
              hex: 2f2a0ae8aeade8aeb0200a5b726577726974655f
              ascii: "/* [rewrite_"
            size: 5369
            permissions: null
            content:
              type: sparse data
              elements:
              - offset: 273
                data: var _0x
              length: 5369
          score: 79
          reasons:
          - type: reason
            summary: YARA rule OBFUSC
            signature:
              score: 65
              origin: internal
              kind: YARA Rule
              date: 2025-03-29
              tags:
              - OBFUS
              rule_name: OBFUSC
              description: Detects obfuscated JavaScript code
            matched:
            - data: "']=!![];}"
              offset: 3865
              field: /content
          reason_count: 1
          context: null
          log_version: v3.0.0
        status: Sample analysis complete
      properties:
        status:
          description: Current status of the scan
          example: Currently being scanned
          type: string
        result:
          $ref: "#/components/schemas/ThorReport"
      required:
      - status
      type: object
    TimestampMap:
      additionalProperties:
        format: int64
        type: integer
      description: Map of timestamps to integer values
      example:
        "2026-01-21 06:45": 0
        "2026-01-21 07:00": 9165
        "2026-01-21 07:15": 49023
        "2026-01-21 07:30": 61685
        "2026-01-21 07:45": 54932
      type: object
    ThunderstormInfo:
      description: "Information about the Thunderstorm service instance, including\
        \ version details, configuration, and license information."
      example:
        version_info:
          thor: 10.8.0
          build: 2026-01-07 04:02:31
          signatures: 2026/01/12-160550
          sigma: r2025-12-01-18-g6d581764e
        arguments:
        - --config
        - /opt/nextron/thunderstorm/config/custom-thor.yml
        license_expiration: 2026-07-08T00:00:00Z
        license_owner: admin
        scan_speed_limitation: 0
        threads: 16
      properties:
        version_info:
          $ref: "#/components/schemas/ThunderstormVersionInfo"
        arguments:
          description: Command-line arguments used to start the underlying THOR instance.
          example:
          - --config
          - /opt/nextron/thunderstorm/config/custom-thor.yml
          items:
            type: string
          type: array
        license_expiration:
          description: Expiration date and time of the license in ISO 8601 format.
          example: 2026-07-08T00:00:00Z
          format: date-time
          type: string
        license_owner:
          description: Name of the license owner.
          example: admin
          type: string
        scan_speed_limitation:
          description: Scan speed limitation in bytes per second. A value of 0 indicates
            no limitation.
          example: 0
          format: int64
          type: integer
        threads:
          description: Number of threads used for scanning.
          example: 16
          format: int64
          type: integer
      required:
      - arguments
      - license_expiration
      - license_owner
      - scan_speed_limitation
      - threads
      - version_info
      type: object
    ThunderstormVersionInfo:
      description: Version information for various components of the Thunderstorm
        service.
      properties:
        thor:
          description: Version of the THOR scanner engine.
          example: 10.8.0
          type: string
        build:
          description: Build timestamp of the THOR scanner.
          example: 2026-01-07 04:02:31
          type: string
        signatures:
          description: Version/timestamp of the signature database.
          example: 2026/01/12-160550
          type: string
        sigma:
          description: Version identifier of the Sigma rules.
          example: r2025-12-01-18-g6d581764e
          type: string
      type: object
    ThunderstormStatus:
      description: Live information about the running THOR instance
      example:
        scanned_samples: 18686305
        queued_async_requests: 0
        avg_scan_time_milliseconds: 21
        avg_wait_time_milliseconds: 0
      properties:
        scanned_samples:
          description: Total number of samples that have been scanned
          example: 18686305
          format: int64
          type: integer
        queued_async_requests:
          description: Number of asynchronous requests currently in queue
          example: 0
          format: int64
          type: integer
        avg_scan_time_milliseconds:
          description: Average time in milliseconds to scan a sample
          example: 21
          format: int64
          type: integer
        avg_wait_time_milliseconds:
          description: Average wait time in milliseconds before processing
          example: 0
          format: int64
          type: integer
      required:
      - avg_scan_time_milliseconds
      - avg_wait_time_milliseconds
      - queued_async_requests
      - scanned_samples
      type: object
    Error:
      description: Error with message
      example:
        message: message
      properties:
        message:
          description: Error message describing the problem
          type: string
      required:
      - message
      type: object
